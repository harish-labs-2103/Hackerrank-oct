[project]
name = "data-investigator"
version = "0.1.0"
description = "Evidence-backed deletion auditing CLI + guarded local LLM (Ghost Data Still Exists)"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2", "PyYAML>=6", "pypdf>=4", "httpx>=0.27", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
data-investigator = "data_investigator.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_investigator*"]

[tool.ruff]
line-length = 130
